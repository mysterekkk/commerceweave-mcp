    <rect x="256" y="200" width="110" height="70" rx="8" fill="#13244a"/><text x="311" y="228">Allegro</text><text x="311" y="248" fill="#9fb0d0" font-size="12">connector</text>
    <rect x="376" y="200" width="110" height="70" rx="8" fill="#13244a"/><text x="431" y="228">Base.com</text><text x="431" y="248" fill="#9fb0d0" font-size="12">connector</text>
    <rect x="496" y="200" width="110" height="70" rx="8" fill="#13244a"/><text x="551" y="228">WooCommerce</text><text x="551" y="248" fill="#9fb0d0" font-size="12">connector</text>
    <rect x="690" y="40" width="150" height="70" rx="12" fill="#13244a" stroke="#2dd4bf"/><text x="765" y="70" font-weight="700">Allegro API</text><text x="765" y="90" fill="#9fb0d0" font-size="12">OAuth2 · REST</text>
