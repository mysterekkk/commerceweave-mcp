  </g>
  <g stroke="#2dd4bf" stroke-width="2" fill="none"><path d="M174 160 H236"/><path d="M606 235 H640 V75 H690"/><path d="M606 235 H660 V165 H690"/><path d="M606 235 H690"/></g>
  <text x="430" y="316" fill="#9fb0d0" font-size="12" text-anchor="middle">Approvals come from a human terminal (commerceweave-mcp approve), never from the model.</text>
