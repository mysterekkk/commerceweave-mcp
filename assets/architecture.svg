<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="CommerceWeave architecture">
  <rect width="860" height="330" rx="16" fill="#0b1530"/>
  <g fill="#e6edf7" font-size="14" text-anchor="middle">
    <rect x="24" y="116" width="150" height="88" rx="12" fill="#13244a" stroke="#2dd4bf"/><text x="99" y="152" font-weight="700">AI client</text><text x="99" y="174" fill="#9fb0d0" font-size="12">Claude Code / Desktop</text><text x="99" y="190" fill="#9fb0d0" font-size="12">Cursor / any MCP client</text>
    <rect x="236" y="40" width="388" height="250" rx="14" fill="#0f1d3d" stroke="#8b5cf6"/><text x="430" y="66" font-weight="700">CommerceWeave MCP (local process, stdio)</text>
    <rect x="256" y="84" width="170" height="46" rx="8" fill="#13244a"/><text x="341" y="112">Unified tools</text>
    <rect x="436" y="84" width="170" height="46" rx="8" fill="#13244a"/><text x="521" y="112">Platform read tools</text>
